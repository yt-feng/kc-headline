name: Scheduled Batch

on:
  schedule:
    - cron: "43 10 * * 5"
  workflow_dispatch:
    inputs:
      operation:
        description: Manual operation
        required: true
        default: preview
        type: choice
        options:
          - preview
          - recover-missed-schedule
      publication_date:
        description: Friday date for an explicit recovery (YYYY-MM-DD)
        required: false
        type: string

permissions: {}

concurrency:
  group: scheduled-batch-main
  queue: max

jobs:
  execute:
    name: Execute encrypted batch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.handoff.outputs.base_sha }}
      state_digest: ${{ steps.handoff.outputs.state_digest }}
      document_digest: ${{ steps.handoff.outputs.document_digest }}
      pdf_digest: ${{ steps.handoff.outputs.pdf_digest }}
      output_date: ${{ steps.plan.outputs.output_date }}
      should_persist: ${{ steps.plan.outputs.should_persist }}
      persist_requested: ${{ steps.plan.outputs.persist_requested }}
    steps:
      - name: Check out control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify source digest workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/workflow_guard.py --workflow .github/workflows/batch.yml

      - name: Prepare encrypted runtime
        id: prepare
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${BUNDLE_KEY:-}" ]]; then
            echo "::error::Required runtime material is unavailable."
            exit 1
          fi
          printf '%s' "$BUNDLE_KEY" > "$RUNNER_TEMP/bundle.pass"
          unset BUNDLE_KEY
          mkdir -p "$RUNNER_TEMP/private-runtime"
          set +e
          (
            set -euo pipefail
            test -s payload/runtime.enc
            python tools/envelope.py decrypt \
              --context runtime \
              --key-file "$RUNNER_TEMP/bundle.pass" \
              --input payload/runtime.enc \
              --output "$RUNNER_TEMP/runtime.tar.gz"
            python tools/archive_guard.py \
              --archive "$RUNNER_TEMP/runtime.tar.gz" \
              --destination "$RUNNER_TEMP/private-runtime"
            test -f "$RUNNER_TEMP/private-runtime/pyproject.toml"
            test -f "$RUNNER_TEMP/private-runtime/tools/private_batch.py"
            test -f "$RUNNER_TEMP/private-runtime/tools/prepare_system.sh"
            unlink "$RUNNER_TEMP/bundle.pass"
            sudo bash "$RUNNER_TEMP/private-runtime/tools/prepare_system.sh"
            python -m pip install --disable-pip-version-check --quiet "$RUNNER_TEMP/private-runtime"
          ) >"$RUNNER_TEMP/prepare.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Runtime preparation failed."
            exit "$status"
          fi

      - name: Plan repository update
        id: plan
        shell: bash
        env:
          JOB_EVENT: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ github.event.inputs.operation || 'preview' }}
          REQUESTED_DATE: ${{ github.event.inputs.publication_date || '' }}
        run: |
          set -euo pipefail
          persist_requested=false
          if [[ "$JOB_EVENT" == "schedule" ]]; then
            if [[ -n "$REQUESTED_DATE" ]]; then
              echo "::error::Scheduled runs cannot override the publication date."
              exit 1
            fi
            persist_requested=true
          elif [[ "$REQUESTED_OPERATION" == "recover-missed-schedule" ]]; then
            if [[ -z "$REQUESTED_DATE" ]]; then
              echo "::error::An explicit recovery date is required."
              exit 1
            fi
            persist_requested=true
          elif [[ "$REQUESTED_OPERATION" != "preview" ]]; then
            echo "::error::Unknown manual operation."
            exit 1
          fi

          publication_arguments=()
          if [[ -n "$REQUESTED_DATE" ]]; then
            publication_arguments=(--publication-date "$REQUESTED_DATE")
          fi
          (
            cd "$RUNNER_TEMP/private-runtime"
            python -m tools.private_batch \
              --mode plan \
              "${publication_arguments[@]}" > "$RUNNER_TEMP/plan.json"
          )
          plan_values="$(python - \
            "$RUNNER_TEMP/plan.json" \
            "$RUNNER_TEMP/private-runtime/state/issue.json" \
            "$JOB_EVENT" \
            "$REQUESTED_OPERATION" \
            "$REQUESTED_DATE" <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys

          plan = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          state = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          event = sys.argv[3]
          operation = sys.argv[4]
          requested = sys.argv[5]
          if set(plan) != {"status", "mode", "publication_date", "already_published"}:
              raise SystemExit("unexpected plan schema")
          if plan["status"] != "ok" or plan["mode"] != "plan":
              raise SystemExit("invalid plan status")
          value = plan["publication_date"]
          published = plan["already_published"]
          if not isinstance(value, str) or not isinstance(published, bool):
              raise SystemExit("invalid plan values")
          parsed = dt.date.fromisoformat(value)
          if parsed.isoformat() != value or parsed.weekday() != 4:
              raise SystemExit("non-canonical plan date")
          if requested and requested != value:
              raise SystemExit("requested date is not the canonical plan date")
          if event == "workflow_dispatch" and operation == "recover-missed-schedule":
              last_data = state.get("last_published") if isinstance(state, dict) else None
              if state.get("schema_version") != 1 or not isinstance(last_data, dict):
                  raise SystemExit("invalid persisted state")
              last_date = dt.date.fromisoformat(str(last_data.get("publication_date") or ""))
              if parsed not in {last_date, last_date + dt.timedelta(days=7)}:
                  raise SystemExit("recovery must target the current or next unpublished Friday")
              shanghai_today = dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).date()
              if parsed > shanghai_today:
                  raise SystemExit("recovery date is in the future")
          print(f"{value}|{'true' if published else 'false'}")
          PY
          )"
          IFS='|' read -r output_date already_published <<EOF
          $plan_values
          EOF
          if [[ ! "$output_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid planned output date."
            exit 1
          fi

          document_path="output/$output_date.docx"
          pdf_path="output/$output_date.pdf"
          document_exists=false
          pdf_exists=false
          if [[ -e "$document_path" || -L "$document_path" ]]; then
            if [[ ! -f "$document_path" || -L "$document_path" ]]; then
              echo "::error::Invalid planned document path."
              exit 1
            fi
            document_exists=true
          fi
          if [[ -e "$pdf_path" || -L "$pdf_path" ]]; then
            if [[ ! -f "$pdf_path" || -L "$pdf_path" ]]; then
              echo "::error::Invalid planned portable document path."
              exit 1
            fi
            pdf_exists=true
          fi

          echo "output_date=$output_date" >> "$GITHUB_OUTPUT"
          echo "persist_requested=$persist_requested" >> "$GITHUB_OUTPUT"
          if [[ "$persist_requested" != "true" ]]; then
            echo "should_persist=false" >> "$GITHUB_OUTPUT"
            echo "run_batch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$document_exists" == "true" && "$pdf_exists" == "true" ]]; then
            if [[ "$already_published" != "true" ]]; then
              echo "::error::The scheduled output is ahead of persisted state."
              exit 1
            fi
            git ls-files --error-unmatch "$document_path" "$pdf_path" >/dev/null
            echo "should_persist=false" >> "$GITHUB_OUTPUT"
            echo "run_batch=false" >> "$GITHUB_OUTPUT"
            echo "The scheduled output already exists."
            exit 0
          fi
          if [[ "$document_exists" != "$pdf_exists" ]]; then
            echo "::error::The scheduled output pair is incomplete."
            exit 1
          fi
          if [[ "$already_published" == "true" ]]; then
            echo "::error::Persisted state has no matching scheduled output."
            exit 1
          fi
          echo "should_persist=true" >> "$GITHUB_OUTPUT"
          echo "run_batch=true" >> "$GITHUB_OUTPUT"

      - name: Execute private batch
        id: execute
        if: >-
          success() &&
          steps.plan.outputs.run_batch == 'true'
        shell: bash
        env:
          PERSIST_REQUESTED: ${{ steps.plan.outputs.persist_requested }}
          PLANNED_OUTPUT_DATE: ${{ steps.plan.outputs.output_date }}
          JOB_EXPORT_DIR: ${{ runner.temp }}/private-export
          JOB_STATE_DIR: ${{ runner.temp }}/private-runtime-next
        run: |
          set -euo pipefail
          if [[ "$PERSIST_REQUESTED" == "true" ]]; then
            export JOB_MODE="scheduled"
          else
            export JOB_MODE="preview"
          fi
          mkdir -p "$JOB_EXPORT_DIR"
          set +e
          (
            cd "$RUNNER_TEMP/private-runtime"
            python -m tools.private_batch \
              --mode "$JOB_MODE" \
              --publication-date "$PLANNED_OUTPUT_DATE"
          ) >"$RUNNER_TEMP/job.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Batch execution failed. Download the encrypted diagnostic artifact."
            exit "$status"
          fi
          echo "Batch execution completed."

      - name: Encrypt result and diagnostics
        id: package
        if: always()
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${BUNDLE_KEY:-}" ]]; then
            echo "::error::Result encryption material is unavailable."
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/bundle.pass" ]]; then
            printf '%s' "$BUNDLE_KEY" > "$RUNNER_TEMP/bundle.pass"
          fi
          unset BUNDLE_KEY
          mkdir -p "$RUNNER_TEMP/result-envelope" artifacts
          if [[ -f "$RUNNER_TEMP/prepare.log" ]]; then
            cp "$RUNNER_TEMP/prepare.log" "$RUNNER_TEMP/result-envelope/prepare.log"
          fi
          if [[ -f "$RUNNER_TEMP/job.log" ]]; then
            cp "$RUNNER_TEMP/job.log" "$RUNNER_TEMP/result-envelope/job.log"
          fi
          if [[ -d "$RUNNER_TEMP/private-export" ]]; then
            cp -R "$RUNNER_TEMP/private-export" "$RUNNER_TEMP/result-envelope/output"
          fi
          {
            echo "prepare=$PREPARE_OUTCOME"
            echo "execute=$EXECUTE_OUTCOME"
            echo "run_id=$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/result-envelope/status.txt"
          tar -czf "$RUNNER_TEMP/result.tar.gz" -C "$RUNNER_TEMP/result-envelope" .
          python tools/envelope.py encrypt \
            --context result \
            --key-file "$RUNNER_TEMP/bundle.pass" \
            --input "$RUNNER_TEMP/result.tar.gz" \
            --output artifacts/result.enc
          python tools/envelope.py decrypt \
            --context result \
            --key-file "$RUNNER_TEMP/bundle.pass" \
            --input artifacts/result.enc \
            --output "$RUNNER_TEMP/result.verify.tar.gz"
          cmp -s "$RUNNER_TEMP/result.tar.gz" "$RUNNER_TEMP/result.verify.tar.gz"
          test -s artifacts/result.enc

      - name: Upload encrypted artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/result.enc
          if-no-files-found: error
          retention-days: 7

      - name: Prepare encrypted state handoff
        id: handoff
        if: >-
          success() && steps.plan.outputs.persist_requested == 'true' &&
          steps.plan.outputs.should_persist == 'true'
        shell: bash
        env:
          PLANNED_OUTPUT_DATE: ${{ steps.plan.outputs.output_date }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/state-handoff" "$RUNNER_TEMP/output-handoff"
          test -f "$RUNNER_TEMP/private-runtime-next/.runtime-ready"
          tar -czf "$RUNNER_TEMP/runtime.next.tar.gz" \
            -C "$RUNNER_TEMP/private-runtime-next" .
          python tools/envelope.py encrypt \
            --context runtime \
            --key-file "$RUNNER_TEMP/bundle.pass" \
            --input "$RUNNER_TEMP/runtime.next.tar.gz" \
            --output "$RUNNER_TEMP/state-handoff/runtime.enc"
          python tools/envelope.py decrypt \
            --context runtime \
            --key-file "$RUNNER_TEMP/bundle.pass" \
            --input "$RUNNER_TEMP/state-handoff/runtime.enc" \
            --output "$RUNNER_TEMP/runtime.next.verify.tar.gz"
          cmp -s "$RUNNER_TEMP/runtime.next.tar.gz" "$RUNNER_TEMP/runtime.next.verify.tar.gz"
          mkdir -p "$RUNNER_TEMP/runtime-next-verify"
          python tools/archive_guard.py \
            --archive "$RUNNER_TEMP/runtime.next.verify.tar.gz" \
            --destination "$RUNNER_TEMP/runtime-next-verify"
          test -f "$RUNNER_TEMP/runtime-next-verify/.runtime-ready"
          test -f "$RUNNER_TEMP/runtime-next-verify/pyproject.toml"
          test -f "$RUNNER_TEMP/runtime-next-verify/requirements.txt"
          test -f "$RUNNER_TEMP/runtime-next-verify/tools/__init__.py"
          test -f "$RUNNER_TEMP/runtime-next-verify/tools/private_batch.py"
          test -f "$RUNNER_TEMP/runtime-next-verify/tools/prepare_system.sh"

          output_date="$(python - \
            "$RUNNER_TEMP/private-export" \
            "$RUNNER_TEMP/output-handoff" \
            "$RUNNER_TEMP/runtime-next-verify/state/issue.json" \
            "$RUNNER_TEMP/runtime-next-verify/reports/index.json" \
            "$PLANNED_OUTPUT_DATE" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import re
          import shutil
          import sys
          import zipfile

          export_root = pathlib.Path(sys.argv[1])
          output_root = pathlib.Path(sys.argv[2])
          state_path = pathlib.Path(sys.argv[3])
          index_path = pathlib.Path(sys.argv[4])
          planned_date = sys.argv[5]
          if not export_root.is_dir() or export_root.is_symlink():
              raise SystemExit("invalid export directory")
          members = list(export_root.iterdir())
          if len(members) != 4 or any(
              not path.is_file() or path.is_symlink() for path in members
          ):
              raise SystemExit("export must contain four regular files")
          documents = [path for path in members if path.suffix == ".docx"]
          pdfs = [path for path in members if path.suffix == ".pdf"]
          manifests = [path for path in members if path.name == "manifest.json"]
          checksum_files = [
              path for path in members if path.name == "checksums.sha256"
          ]
          if not all(
              len(group) == 1
              for group in (documents, pdfs, manifests, checksum_files)
          ):
              raise SystemExit("export does not contain one validated file set")

          data = json.loads(manifests[0].read_text(encoding="utf-8"))
          if data.get("status") != "validated":
              raise SystemExit("export is not validated")
          issue = data.get("issue")
          if not isinstance(issue, dict):
              raise SystemExit("missing issue metadata")
          value = issue.get("publication_date")
          if not isinstance(value, str):
              raise SystemExit("missing publication date")
          parsed = dt.date.fromisoformat(value)
          if parsed.isoformat() != value or parsed.weekday() != 4:
              raise SystemExit("non-canonical publication date")
          if value != planned_date:
              raise SystemExit("export date differs from the scheduled plan")

          document = documents[0]
          pdf = pdfs[0]
          if document.name != f"{value}.docx" or pdf.name != f"{value}.pdf":
              raise SystemExit("export filenames are not date-only")

          checksum_lines = checksum_files[0].read_text(
              encoding="utf-8"
          ).splitlines()
          if len(checksum_lines) != 3:
              raise SystemExit("invalid checksum entry count")
          checksums = {}
          for line in checksum_lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if match is None or match.group(2) in checksums:
                  raise SystemExit("invalid checksum entry")
              checksums[match.group(2)] = match.group(1)
          checked_files = {document.name, pdf.name, manifests[0].name}
          if set(checksums) != checked_files:
              raise SystemExit("checksum path set mismatch")
          for path in (document, pdf, manifests[0]):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != checksums[path.name]:
                  raise SystemExit("checksum mismatch")

          issue_identity = {
              "publication_date": value,
              "year": parsed.year,
              "annual_issue": issue.get("annual_issue"),
              "total_issue": issue.get("total_issue"),
          }
          if not all(
              isinstance(issue_identity[key], int)
              and not isinstance(issue_identity[key], bool)
              and issue_identity[key] > 0
              for key in ("annual_issue", "total_issue")
          ):
              raise SystemExit("invalid issue identity")
          if issue.get("year") != parsed.year:
              raise SystemExit("issue year mismatch")

          state = json.loads(state_path.read_text(encoding="utf-8"))
          last_published = state.get("last_published")
          if state.get("schema_version") != 1 or not isinstance(
              last_published, dict
          ):
              raise SystemExit("invalid persisted state")
          if any(
              last_published.get(key) != expected
              for key, expected in issue_identity.items()
          ):
              raise SystemExit("persisted state does not match the export")

          index = json.loads(index_path.read_text(encoding="utf-8"))
          publications = index.get("publications")
          if index.get("schema_version") != 1 or not isinstance(
              publications, list
          ) or not publications:
              raise SystemExit("invalid persisted index")
          matching_rows = [
              row
              for row in publications
              if isinstance(row, dict)
              and row.get("publication_date") == value
          ]
          if len(matching_rows) != 1 or publications[-1] is not matching_rows[0]:
              raise SystemExit("persisted index date mismatch")
          index_row = matching_rows[0]
          if any(
              index_row.get(key) != expected
              for key, expected in issue_identity.items()
          ) or index_row.get("status") != "private-exported":
              raise SystemExit("persisted index identity mismatch")
          delivery = index_row.get("delivery")
          if not isinstance(delivery, dict) or (
              delivery.get("type") != "job-export"
              or delivery.get("manifest") != "manifest.json"
              or delivery.get("manifest_sha256") != checksums["manifest.json"]
          ):
              raise SystemExit("persisted index manifest mismatch")

          if not zipfile.is_zipfile(document):
              raise SystemExit("invalid document container")
          with zipfile.ZipFile(document) as archive:
              required = {"[Content_Types].xml", "word/document.xml"}
              if not required.issubset(archive.namelist()):
                  raise SystemExit("incomplete document container")
              if archive.testzip() is not None:
                  raise SystemExit("corrupt document member")
          with pdf.open("rb") as handle:
              if handle.read(5) != b"%PDF-":
                  raise SystemExit("invalid portable document")

          shutil.copyfile(document, output_root / f"{value}.docx")
          shutil.copyfile(pdf, output_root / f"{value}.pdf")
          print(value)
          PY
          )"
          if [[ ! "$output_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid scheduled output date."
            exit 1
          fi

          base_sha="$(git rev-parse HEAD)"
          state_digest="$(sha256sum "$RUNNER_TEMP/state-handoff/runtime.enc")"
          state_digest="${state_digest%% *}"
          document_digest="$(sha256sum "$RUNNER_TEMP/output-handoff/$output_date.docx")"
          document_digest="${document_digest%% *}"
          pdf_digest="$(sha256sum "$RUNNER_TEMP/output-handoff/$output_date.pdf")"
          pdf_digest="${pdf_digest%% *}"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "state_digest=$state_digest" >> "$GITHUB_OUTPUT"
          echo "document_digest=$document_digest" >> "$GITHUB_OUTPUT"
          echo "pdf_digest=$pdf_digest" >> "$GITHUB_OUTPUT"
          echo "output_date=$output_date" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted state handoff
        if: >-
          success() && steps.plan.outputs.persist_requested == 'true' &&
          steps.plan.outputs.should_persist == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-handoff/runtime.enc
          if-no-files-found: error
          retention-days: 1

      - name: Upload scheduled output handoff
        if: >-
          success() && steps.plan.outputs.persist_requested == 'true' &&
          steps.plan.outputs.should_persist == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output-handoff
          if-no-files-found: error
          retention-days: 1

      - name: Remove plaintext workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            "$RUNNER_TEMP/private-runtime" \
            "$RUNNER_TEMP/private-runtime-next" \
            "$RUNNER_TEMP/private-export" \
            "$RUNNER_TEMP/result-envelope" \
            "$RUNNER_TEMP/state-handoff" \
            "$RUNNER_TEMP/output-handoff" \
            "$RUNNER_TEMP/runtime-next-verify"; do
            if [[ -e "$target" ]]; then
              find "$target" -depth -delete
            fi
          done
          for target in \
            "$RUNNER_TEMP/bundle.pass" \
            "$RUNNER_TEMP/runtime.tar.gz" \
            "$RUNNER_TEMP/runtime.next.tar.gz" \
            "$RUNNER_TEMP/runtime.next.verify.tar.gz" \
            "$RUNNER_TEMP/result.tar.gz" \
            "$RUNNER_TEMP/result.verify.tar.gz" \
            "$RUNNER_TEMP/plan.json" \
            "$RUNNER_TEMP/prepare.log" \
            "$RUNNER_TEMP/job.log"; do
            if [[ -f "$target" ]]; then
              unlink "$target"
            fi
          done

  persist:
    name: Persist validated batch
    needs: execute
    if: >-
      needs.execute.result == 'success' &&
      needs.execute.outputs.persist_requested == 'true' &&
      needs.execute.outputs.should_persist == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out current control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Download opaque state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-handoff-in

      - name: Download scheduled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output-handoff-in

      - name: Validate fixed handoff
        shell: bash
        env:
          HANDOFF_BASE_SHA: ${{ needs.execute.outputs.base_sha }}
          HANDOFF_STATE_DIGEST: ${{ needs.execute.outputs.state_digest }}
          HANDOFF_DOCUMENT_DIGEST: ${{ needs.execute.outputs.document_digest }}
          HANDOFF_PDF_DIGEST: ${{ needs.execute.outputs.pdf_digest }}
          HANDOFF_OUTPUT_DATE: ${{ needs.execute.outputs.output_date }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/state-handoff-in"
          output_root="$RUNNER_TEMP/output-handoff-in"
          output_date="$HANDOFF_OUTPUT_DATE"
          base_sha="$HANDOFF_BASE_SHA"
          state_digest="$HANDOFF_STATE_DIGEST"
          document_digest="$HANDOFF_DOCUMENT_DIGEST"
          pdf_digest="$HANDOFF_PDF_DIGEST"

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid handoff base revision."
            exit 1
          fi
          if [[ ! "$state_digest" =~ ^[0-9a-f]{64}$ \
            || ! "$document_digest" =~ ^[0-9a-f]{64}$ \
            || ! "$pdf_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid handoff digest."
            exit 1
          fi
          if [[ ! "$output_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid handoff output date."
            exit 1
          fi

          actual_state_paths="$(
            cd "$state_root"
            find . -type f -print | LC_ALL=C sort
          )"
          if [[ "$actual_state_paths" != './runtime.enc' ]]; then
            echo "::error::Unexpected state handoff path set."
            exit 1
          fi
          expected_output_paths="$(printf '%s\n' \
            "./$output_date.docx" \
            "./$output_date.pdf" | LC_ALL=C sort)"
          actual_output_paths="$(
            cd "$output_root"
            find . -type f -print | LC_ALL=C sort
          )"
          if [[ "$actual_output_paths" != "$expected_output_paths" ]]; then
            echo "::error::Unexpected output handoff path set."
            exit 1
          fi
          if find "$state_root" "$output_root" -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links are not allowed in the handoff."
            exit 1
          fi
          if find "$state_root" "$output_root" -mindepth 1 -type d -print -quit | grep -q .; then
            echo "::error::Directories are not allowed inside the handoff."
            exit 1
          fi
          test -s "$state_root/runtime.enc"
          test -s "$output_root/$output_date.docx"
          test -s "$output_root/$output_date.pdf"

          python - "$output_date" <<'PY'
          import datetime as dt
          import sys

          parsed_date = dt.date.fromisoformat(sys.argv[1])
          if parsed_date.isoformat() != sys.argv[1] or parsed_date.weekday() != 4:
              raise SystemExit("non-canonical handoff output date")
          PY

          if [[ "$(git rev-parse HEAD)" != "$base_sha" ]]; then
            echo "::error::The control plane changed during execution."
            exit 1
          fi
          actual_state_digest="$(sha256sum "$state_root/runtime.enc")"
          actual_state_digest="${actual_state_digest%% *}"
          actual_document_digest="$(sha256sum "$output_root/$output_date.docx")"
          actual_document_digest="${actual_document_digest%% *}"
          actual_pdf_digest="$(sha256sum "$output_root/$output_date.pdf")"
          actual_pdf_digest="${actual_pdf_digest%% *}"
          if [[ "$actual_state_digest" != "$state_digest" \
            || "$actual_document_digest" != "$document_digest" \
            || "$actual_pdf_digest" != "$pdf_digest" ]]; then
            echo "::error::Handoff file digest mismatch."
            exit 1
          fi

          python - \
            "$output_root/$output_date.docx" \
            "$output_root/$output_date.pdf" <<'PY'
          import pathlib
          import sys
          import zipfile

          document = pathlib.Path(sys.argv[1])
          pdf = pathlib.Path(sys.argv[2])
          if not zipfile.is_zipfile(document):
              raise SystemExit("invalid document container")
          with zipfile.ZipFile(document) as archive:
              required = {"[Content_Types].xml", "word/document.xml"}
              if not required.issubset(archive.namelist()) or archive.testzip() is not None:
                  raise SystemExit("invalid document contents")
          with pdf.open("rb") as handle:
              if handle.read(5) != b"%PDF-":
                  raise SystemExit("invalid portable document")
          PY

      - name: Commit validated batch
        shell: bash
        env:
          HANDOFF_BASE_SHA: ${{ needs.execute.outputs.base_sha }}
          HANDOFF_OUTPUT_DATE: ${{ needs.execute.outputs.output_date }}
          HANDOFF_STATE_DIGEST: ${{ needs.execute.outputs.state_digest }}
          HANDOFF_DOCUMENT_DIGEST: ${{ needs.execute.outputs.document_digest }}
          HANDOFF_PDF_DIGEST: ${{ needs.execute.outputs.pdf_digest }}
        run: |
          set -euo pipefail
          base_sha="$HANDOFF_BASE_SHA"
          output_date="$HANDOFF_OUTPUT_DATE"
          state_root="$RUNNER_TEMP/state-handoff-in"
          output_root="$RUNNER_TEMP/output-handoff-in"
          mkdir -p output
          if [[ -e "output/$output_date.docx" || -L "output/$output_date.docx" \
            || -e "output/$output_date.pdf" || -L "output/$output_date.pdf" ]]; then
            echo "::error::The scheduled output already exists."
            exit 1
          fi
          cp "$state_root/runtime.enc" payload/runtime.enc
          cp "$output_root/$output_date.docx" "output/$output_date.docx"
          cp "$output_root/$output_date.pdf" "output/$output_date.pdf"

          persisted_state_digest="$(sha256sum payload/runtime.enc)"
          persisted_state_digest="${persisted_state_digest%% *}"
          persisted_document_digest="$(sha256sum "output/$output_date.docx")"
          persisted_document_digest="${persisted_document_digest%% *}"
          persisted_pdf_digest="$(sha256sum "output/$output_date.pdf")"
          persisted_pdf_digest="${persisted_pdf_digest%% *}"
          if [[ "$persisted_state_digest" != "$HANDOFF_STATE_DIGEST" \
            || "$persisted_document_digest" != "$HANDOFF_DOCUMENT_DIGEST" \
            || "$persisted_pdf_digest" != "$HANDOFF_PDF_DIGEST" ]]; then
            echo "::error::Persisted file digest mismatch."
            exit 1
          fi

          expected_worktree_status="$(printf '%s\n' \
            ' M payload/runtime.enc' \
            "?? output/$output_date.docx" \
            "?? output/$output_date.pdf" | LC_ALL=C sort)"
          actual_worktree_status="$(
            git status --porcelain=v1 --untracked-files=all | LC_ALL=C sort
          )"
          if [[ "$actual_worktree_status" != "$expected_worktree_status" ]]; then
            echo "::error::Unexpected control-plane change."
            exit 1
          fi
          if git diff --quiet -- payload/runtime.enc; then
            echo "::error::Opaque state did not change."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            payload/runtime.enc \
            "output/$output_date.docx" \
            "output/$output_date.pdf"
          expected_staged_status="$(printf '%s\t%s\n' \
            'A' "output/$output_date.docx" \
            'A' "output/$output_date.pdf" \
            'M' 'payload/runtime.enc' | LC_ALL=C sort)"
          actual_staged_status="$(
            git diff --cached --name-status | LC_ALL=C sort
          )"
          if [[ "$actual_staged_status" != "$expected_staged_status" ]]; then
            echo "::error::Unexpected staged change set."
            exit 1
          fi

          staged_state_digest="$(git show ':payload/runtime.enc' | sha256sum)"
          staged_state_digest="${staged_state_digest%% *}"
          staged_document_digest="$(git show ":output/$output_date.docx" | sha256sum)"
          staged_document_digest="${staged_document_digest%% *}"
          staged_pdf_digest="$(git show ":output/$output_date.pdf" | sha256sum)"
          staged_pdf_digest="${staged_pdf_digest%% *}"
          if [[ "$staged_state_digest" != "$HANDOFF_STATE_DIGEST" \
            || "$staged_document_digest" != "$HANDOFF_DOCUMENT_DIGEST" \
            || "$staged_pdf_digest" != "$HANDOFF_PDF_DIGEST" ]]; then
            echo "::error::Staged file digest mismatch."
            exit 1
          fi

          git commit -m "chore: publish scheduled batch"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$base_sha" ]]; then
            echo "::error::The control plane changed before persistence."
            exit 1
          fi
          git push origin HEAD:main

  deliver:
    name: Deliver validated batch
    needs: [execute, persist]
    if: >-
      always() && needs.execute.result == 'success' &&
      needs.execute.outputs.persist_requested == 'true' &&
      (
        (
          needs.execute.outputs.should_persist == 'true' &&
          needs.persist.result == 'success'
        ) ||
        (
          needs.execute.outputs.should_persist == 'false' &&
          needs.persist.result == 'skipped'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out persisted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate persisted output
        shell: bash
        env:
          OUTPUT_DATE: ${{ needs.execute.outputs.output_date }}
        run: |
          set -euo pipefail
          if [[ ! "$OUTPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid delivery date."
            exit 1
          fi
          document_path="output/$OUTPUT_DATE.docx"
          pdf_path="output/$OUTPUT_DATE.pdf"
          if [[ ! -f "$document_path" || -L "$document_path" \
            || ! -f "$pdf_path" || -L "$pdf_path" ]]; then
            echo "::error::The persisted output pair is unavailable."
            exit 1
          fi
          git ls-files --error-unmatch "$document_path" "$pdf_path" >/dev/null
          python - "$OUTPUT_DATE" "$document_path" "$pdf_path" <<'PY'
          import datetime as dt
          import pathlib
          import sys
          import zipfile

          value = sys.argv[1]
          document = pathlib.Path(sys.argv[2])
          pdf = pathlib.Path(sys.argv[3])
          parsed = dt.date.fromisoformat(value)
          if parsed.isoformat() != value or parsed.weekday() != 4:
              raise SystemExit("non-canonical delivery date")
          if not zipfile.is_zipfile(document):
              raise SystemExit("invalid document container")
          with zipfile.ZipFile(document) as archive:
              required = {"[Content_Types].xml", "word/document.xml"}
              if not required.issubset(archive.namelist()) or archive.testzip() is not None:
                  raise SystemExit("invalid document contents")
          with pdf.open("rb") as handle:
              if handle.read(5) != b"%PDF-":
                  raise SystemExit("invalid portable document")
          PY

      - name: Prepare delivery runtime
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${BUNDLE_KEY:-}" ]]; then
            echo "::error::Required runtime material is unavailable."
            exit 1
          fi
          printf '%s' "$BUNDLE_KEY" > "$RUNNER_TEMP/delivery-bundle.pass"
          unset BUNDLE_KEY
          python tools/envelope.py decrypt \
            --context runtime \
            --key-file "$RUNNER_TEMP/delivery-bundle.pass" \
            --input payload/runtime.enc \
            --output "$RUNNER_TEMP/delivery-runtime.tar.gz"
          python tools/archive_guard.py \
            --archive "$RUNNER_TEMP/delivery-runtime.tar.gz" \
            --destination "$RUNNER_TEMP/delivery-runtime"
          test -f "$RUNNER_TEMP/delivery-runtime/.runtime-ready"
          test -f "$RUNNER_TEMP/delivery-runtime/kc_headline/delivery.py"
          test -f "$RUNNER_TEMP/delivery-runtime/pyproject.toml"
          python -m pip install --disable-pip-version-check --quiet "$RUNNER_TEMP/delivery-runtime"
          unlink "$RUNNER_TEMP/delivery-bundle.pass"

      - name: Deliver persisted document
        shell: bash
        env:
          DELIVERY_BASE_URL: ${{ vars.DELIVERY_BASE_URL }}
          DELIVERY_BEARER_TOKEN: ${{ secrets.DELIVERY_BEARER_TOKEN }}
          DELIVERY_SOURCE_REPO: ${{ github.repository }}
          OUTPUT_DATE: ${{ needs.execute.outputs.output_date }}
        run: |
          set -euo pipefail
          if [[ -z "${DELIVERY_BASE_URL:-}" || -z "${DELIVERY_BEARER_TOKEN:-}" ]]; then
            echo "::error::Required delivery configuration is unavailable."
            exit 1
          fi
          set +e
          PYTHONPATH="$RUNNER_TEMP/delivery-runtime" \
            python -m kc_headline.delivery \
              --repo-root "$GITHUB_WORKSPACE" \
              --publication-date "$OUTPUT_DATE" \
              --document "$GITHUB_WORKSPACE/output/$OUTPUT_DATE.docx" \
              >"$RUNNER_TEMP/delivery.log" 2>&1
          status=$?
          set -e
          python tools/secret_guard.py \
            --environment DELIVERY_BEARER_TOKEN \
            --path "$RUNNER_TEMP/delivery-runtime" \
            --path "$RUNNER_TEMP/delivery.log"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Validated delivery failed."
            exit "$status"
          fi
          echo "Validated delivery completed."

      - name: Remove delivery workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for target in "$RUNNER_TEMP/delivery-runtime"; do
            if [[ -e "$target" ]]; then
              find "$target" -depth -delete
            fi
          done
          for target in \
            "$RUNNER_TEMP/delivery-bundle.pass" \
            "$RUNNER_TEMP/delivery-runtime.tar.gz" \
            "$RUNNER_TEMP/delivery.log"; do
            if [[ -f "$target" ]]; then
              unlink "$target"
            fi
          done
